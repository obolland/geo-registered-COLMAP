[project]
name = "georoute"
version = "0.1.0"
description = "Turns GNSS-timed multi-camera captures into geo-registered, streamable Gaussian-splat routes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.1",
    "pycolmap==4.2.1",
]

[project.scripts]
georoute = "georoute.cli:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
# legacy POC scripts, retired in slices 1 and 7
extend-exclude = ["align_colmap_to_gpx_enu"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
